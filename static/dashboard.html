<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReviewBuddy · Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1c1712; --muted:#857a6b; --line:#eee4d4; --card:#fffdf9; --accent:#e8590c; --good:#2f9e44; --blue:#1c7ed6; --pink:#d6336c;
    --shadow-sm:0 1px 2px rgba(60,40,10,.06), 0 4px 14px rgba(60,40,10,.06); }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Plus Jakarta Sans",system-ui,sans-serif; color:var(--ink);
    background:radial-gradient(900px 400px at 100% -10%, rgba(28,126,214,.08), transparent 60%), #fbf6ee; }
  button, input, select { font-family:inherit; color:inherit; }
  .wrap { max-width:1080px; margin:0 auto; padding:24px 20px 50px; }
  .top { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .logo { display:flex; align-items:center; gap:10px; font-weight:800; text-decoration:none; color:var(--ink); }
  .logo i { width:36px; height:36px; border-radius:12px; background:var(--ink); color:#fff; display:flex; align-items:center; justify-content:center; font-style:normal; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; }
  .b { border:1px solid var(--line); background:var(--card); border-radius:12px; padding:10px 14px; font-size:14px; font-weight:700; cursor:pointer; box-shadow:var(--shadow-sm); text-decoration:none; color:var(--ink); }
  .b.dark { background:var(--ink); color:#fff; border-color:var(--ink); }
  .b:disabled { opacity:.6; }
  h1 { font-size:30px; letter-spacing:-.02em; margin:22px 0 2px; }
  .muted { color:var(--muted); font-size:14px; }

  .hero { margin:20px 0; border-radius:26px; padding:26px; color:#fff; display:grid; grid-template-columns:1.2fr 2fr; gap:20px; align-items:center;
    background:radial-gradient(500px 220px at 0% 0%, rgba(140,233,154,.18), transparent 70%), linear-gradient(135deg,#1c1712,#2b241c); box-shadow:0 20px 40px rgba(28,23,18,.25); }
  .hero .big { font-size:64px; font-weight:800; letter-spacing:-.03em; line-height:1; color:#8ce99a; }
  .hero .lbl { opacity:.8; margin-top:8px; }
  .kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .kpi { background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.08); border-radius:16px; padding:14px; }
  .kpi b { font-size:26px; display:block; } .kpi span { font-size:12px; opacity:.7; }

  .shop { background:var(--card); border:1px solid var(--line); border-radius:24px; padding:22px; margin-top:18px; box-shadow:var(--shadow-sm); }
  .shead { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
  .shead h2 { margin:0; font-size:20px; display:flex; align-items:center; gap:10px; }
  .emo { width:40px; height:40px; border-radius:13px; background:#f6efe3; display:inline-flex; align-items:center; justify-content:center; font-size:20px; }
  .gcount { text-align:right; }
  .gcount .n { font-size:28px; font-weight:800; } .gcount .plus { color:var(--good); font-weight:800; margin-left:6px; }
  .grid { display:grid; grid-template-columns:1.3fr 1fr; gap:18px; margin-top:18px; }
  .panel { border:1px solid var(--line); border-radius:18px; padding:16px; background:#fff; }
  .panel h3 { margin:0 0 12px; font-size:13px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; }
  .legend { display:flex; gap:12px; font-size:12px; color:var(--muted); margin-top:8px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:4px; vertical-align:-1px; }
  .fbar { display:grid; grid-template-columns:130px 1fr 40px; gap:10px; align-items:center; font-size:14px; margin:7px 0; }
  .track { height:12px; background:#f4eee4; border-radius:8px; overflow:hidden; } .fill { height:100%; border-radius:8px; transition:width .6s; }
  .fbar b { text-align:right; }
  .moodbar { display:flex; height:30px; border-radius:10px; overflow:hidden; margin:6px 0 8px; background:#f4eee4; }
  .moodbar div { display:flex; align-items:center; justify-content:center; font-size:14px; color:#fff; min-width:0; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; } .tag { font-size:12px; background:#f6efe3; border-radius:999px; padding:5px 10px; font-weight:600; }
  .insight { margin-top:18px; border-radius:18px; padding:16px; background:linear-gradient(135deg,#f3f0ff,#fff7ec); border:1px solid #e9e2fb; }
  .insight h4 { margin:0 0 6px; } .insight ul { margin:6px 0 0 18px; padding:0; } .insight li { margin:3px 0; font-size:14px; }
  .icols { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:10px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:16px; padding-top:14px; border-top:1px dashed var(--line); font-size:14px; }
  .row input { width:110px; padding:10px; border:1px solid var(--line); border-radius:10px; font-size:15px; }
  .links { display:flex; gap:14px; flex-wrap:wrap; margin-left:auto; } .links a { color:var(--accent); font-weight:700; font-size:14px; text-decoration:none; }

  .login, .modal .box { background:var(--card); border:1px solid var(--line); border-radius:22px; padding:24px; box-shadow:0 20px 50px rgba(28,23,18,.15); }
  .login { max-width:380px; margin:30px 0; }
  .field { margin-top:12px; } .field label { display:block; font-size:13px; font-weight:700; margin-bottom:5px; }
  .field input, .field select { width:100%; padding:12px; border:1px solid var(--line); border-radius:12px; font-size:15px; background:#fff; }
  .modal { position:fixed; inset:0; background:rgba(28,23,18,.45); display:flex; align-items:center; justify-content:center; padding:16px; z-index:5; }
  .modal .box { width:100%; max-width:520px; max-height:92vh; overflow:auto; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:12px 18px; border-radius:14px; font-weight:700; z-index:9; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#2f9e44; margin-right:4px; animation:pl 1.6s infinite; vertical-align:1px; }
  @keyframes pl { 50% { opacity:.3; } }
  .hidden { display:none !important; }
  @media (max-width:820px) { .hero, .grid, .icols { grid-template-columns:1fr; } .kpis { grid-template-columns:repeat(2,1fr); } .fbar { grid-template-columns:110px 1fr 34px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="logo" href="/"><i>★</i> ReviewBuddy</a>
    <div class="actions hidden" id="actions">
      <button class="b" id="copyReport">📋 Copy report</button>
      <a class="b" id="csv">⬇ CSV</a>
      <button class="b hidden" id="fetchCounts">↻ Fetch Google counts</button>
      <button class="b dark" id="addBtn">＋ Add business</button>
    </div>
  </div>
  <h1>Owner dashboard</h1>
  <div class="muted"><span class="dot"></span> Live · every customer asked → honest reviews on Google · refreshes every 30 seconds</div>

  <div class="login hidden" id="login">
    <b>Enter admin key</b>
    <div class="field"><input id="key" type="password" placeholder="Admin key"></div>
    <button class="b dark" id="go" style="margin-top:12px;width:100%">Open dashboard</button>
    <div class="muted" id="loginErr" style="margin-top:8px"></div>
  </div>

  <div id="main" class="hidden">
    <div class="hero" id="hero"></div>
    <div id="shops"></div>
  </div>
</div>

<div class="modal hidden" id="modal">
  <div class="box">
    <h2 style="margin:0">Add a business</h2>
    <p class="muted">No code edits or redeploy needed.</p>
    <div class="field"><label>Business name *</label><input id="f_name" placeholder="e.g. Shree Krishna Cafe"></div>
    <div class="two">
      <div class="field"><label>Type</label><select id="f_type"><option value="restaurant">Restaurant / café</option><option value="clinic">Clinic</option><option value="salon">Salon</option><option value="shop">Shop</option><option value="other">Other</option></select></div>
      <div class="field"><label>Icon (emoji)</label><input id="f_emoji" placeholder="☕"></div>
    </div>
    <div class="field"><label>Google review link *</label><input id="f_url" placeholder="https://g.page/r/…/review"></div>
    <div class="field"><label>Menu items / services (comma separated)</label><input id="f_menu" placeholder="Masala Chai, Cold Coffee, Vada Pav"></div>
    <div class="two">
      <div class="field"><label>Google reviews today (before)</label><input id="f_base" type="number" min="0" placeholder="37"></div>
      <div class="field"><label>Staff PIN</label><input id="f_pin" placeholder="1234"></div>
    </div>
    <div class="field"><label>Brand color</label><input id="f_color" type="color" value="#e8590c" style="height:46px;padding:4px"></div>
    <div class="muted" id="f_err" style="color:#c92a2a;margin-top:8px"></div>
    <div style="display:flex;gap:10px;margin-top:16px"><button class="b" id="f_cancel" style="flex:1">Cancel</button><button class="b dark" id="f_save" style="flex:2">Save business</button></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const MOOD = { Excellent:["😍","#2f9e44"], Good:["🙂","#74b816"], Okay:["😐","#f59f00"], "Not good":["😞","#e03131"], "Not given":["·","#ced4da"] };
let key = "", insightCache = {};
try { key = localStorage.getItem("rb_admin") || ""; } catch (e) {}
const post = (path, body) => fetch(path, { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ key, ...body }) });
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }

function chart(daily) {
  const W = 420, H = 150, pad = 22, max = Math.max(1, ...daily.flatMap(d => [d.asked, d.drafted, d.posted]));
  const gw = (W - pad) / daily.length, bw = Math.min(12, (gw - 10) / 3);
  const cols = ["#1c7ed6", "#e8590c", "#2f9e44"];
  let bars = "";
  daily.forEach((d, i) => {
    [d.asked, d.drafted, d.posted].forEach((v, j) => {
      const h = (H - 34) * v / max, x = pad + i * gw + (gw - 3 * bw - 4) / 2 + j * (bw + 2), y = H - 20 - h;
      bars += `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h, v ? 2 : 0)}" rx="3" fill="${cols[j]}"><title>${v}</title></rect>`;
    });
    const lbl = new Date(d.day + "T00:00").toLocaleDateString("en-IN", { weekday:"short" });
    bars += `<text x="${pad + i * gw + gw / 2}" y="${H - 4}" text-anchor="middle" font-size="11" fill="#857a6b">${lbl}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Last 7 days">
    <line x1="${pad}" x2="${W}" y1="${H - 20}" y2="${H - 20}" stroke="#eee4d4"/>
    <text x="0" y="14" font-size="11" fill="#857a6b">${max}</text>${bars}</svg>
    <div class="legend"><span><i style="background:${cols[0]}"></i>Asked</span><span><i style="background:${cols[1]}"></i>Drafted</span><span><i style="background:${cols[2]}"></i>Sent to Google</span></div>`;
}

function moodBar(moods) {
  const total = Object.values(moods).reduce((a, b) => a + b, 0);
  if (!total) return `<div class="muted">No feedback yet.</div>`;
  const order = ["Excellent", "Good", "Okay", "Not good", "Not given"].filter(m => moods[m]);
  return `<div class="moodbar">${order.map(m => `<div style="width:${100 * moods[m] / total}%;background:${MOOD[m][1]}" title="${m}: ${moods[m]}">${moods[m] / total > .08 ? MOOD[m][0] : ""}</div>`).join("")}</div>
    <div class="tags">${order.map(m => `<span class="tag">${MOOD[m][0]} ${m}: ${moods[m]}</span>`).join("")}</div>`;
}

function insightHtml(slug) {
  const x = insightCache[slug]; if (!x) return "";
  const list = a => (a && a.length) ? `<ul>${a.map(i => `<li>${esc(i)}</li>`).join("")}</ul>` : `<div class="muted">-</div>`;
  return `<div class="insight"><h4>✨ ${x.ai ? "AI insights" : "Insights"}</h4><div>${esc(x.summary)}</div>
    <div class="icols"><div><b>💚 Customers love</b>${list(x.loved)}</div><div><b>⚠️ Issues</b>${list(x.issues)}</div><div><b>🎯 Do this week</b>${list(x.actions)}</div></div></div>`;
}

const shown = {};
function countUp(el, i) {
  const m = el.textContent.match(/^(\+?)(\d+)(%?)$/); if (!m) return;
  const target = +m[2], from = shown[i] ?? 0; shown[i] = target;
  if (from === target) return;
  const t0 = performance.now();
  (function step(now) {
    const k = Math.min(1, (now - t0) / 900), v = Math.round(from + (target - from) * (1 - Math.pow(1 - k, 3)));
    el.textContent = m[1] + v + m[3]; if (k < 1) requestAnimationFrame(step);
  })(t0);
}
async function load() {
  const r = await fetch("/api/stats?key=" + encodeURIComponent(key));
  if (!r.ok) { $("loginErr").textContent = key ? "Wrong key" : ""; $("login").classList.remove("hidden"); $("main").classList.add("hidden"); $("actions").classList.add("hidden"); return; }
  try { localStorage.setItem("rb_admin", key); } catch (e) {}
  const data = await r.json();
  $("login").classList.add("hidden"); $("main").classList.remove("hidden"); $("actions").classList.remove("hidden");
  $("csv").href = "/api/export.csv?key=" + encodeURIComponent(key);
  $("fetchCounts").classList.toggle("hidden", !data.some(s => s.auto_count));

  const sum = f => data.reduce((a, s) => a + s[f], 0);
  const asked = sum("asked_whatsapp") + sum("qr_scans"), newR = sum("new_reviews");
  $("hero").innerHTML = `
    <div><div class="big">+${newR}</div><div class="lbl">new Google reviews · ${data.length} business${data.length === 1 ? "" : "es"}</div></div>
    <div class="kpis">
      <div class="kpi"><b>${asked}</b><span>people asked</span></div>
      <div class="kpi"><b>${sum("reviews_drafted")}</b><span>reviews drafted</span></div>
      <div class="kpi"><b>${sum("post_clicks")}</b><span>sent to Google</span></div>
      <div class="kpi"><b>${asked ? Math.round(100 * newR / asked) : 0}%</b><span>asked → reviewed</span></div>
    </div>`;

  document.querySelectorAll("#hero b, #hero .big").forEach(countUp);
  $("shops").innerHTML = data.map(s => {
    const funnel = [["Asked on WhatsApp", s.asked_whatsapp, "#1c7ed6"], ["Reminders sent", s.reminders, "#4dabf7"], ["Scanned QR", s.qr_scans, "#7048e8"],
                    ["Drafted a review", s.reviews_drafted, "#e8590c"], ["Opened Google", s.post_clicks, "#f59f00"], ["New Google reviews", s.new_reviews, "#2f9e44"]];
    const max = Math.max(1, ...funnel.map(f => f[1]));
    const langs = Object.entries(s.langs).map(([l, n]) => `<span class="tag">${esc(l)}: ${n}</span>`).join("") || `<span class="muted">-</span>`;
    return `
    <div class="shop">
      <div class="shead">
        <h2><span class="emo">${esc(s.emoji) || "🏪"}</span>${esc(s.name)}</h2>
        <div class="gcount"><div class="muted">Google reviews ${s.google_rating ? "· ⭐ " + s.google_rating.toFixed(1) : ""}</div>
          <span class="muted">${s.baseline_reviews} →</span> <span class="n">${s.current_reviews}</span><span class="plus">+${s.new_reviews}</span></div>
      </div>
      <div class="grid">
        <div class="panel"><h3>Last 7 days</h3>${chart(s.daily)}</div>
        <div class="panel"><h3>Funnel</h3>${funnel.map(([l, n, c]) => `
          <div class="fbar"><span>${l}</span><div class="track"><div class="fill" style="width:${100 * n / max}%;background:${c}"></div></div><b>${n}</b></div>`).join("")}</div>
        <div class="panel"><h3>How customers felt</h3>${moodBar(s.moods)}<div class="muted" style="margin-top:8px">Everyone is sent to Google, whatever their mood.</div></div>
        <div class="panel"><h3>Languages · AI</h3><div class="tags">${langs}</div><div class="muted" style="margin-top:10px">${s.ai_share}% of drafts written by AI from customers' own words</div></div>
      </div>
      <div id="ins_${s.slug}">${insightHtml(s.slug)}</div>
      <div class="row">
        <span>Google count now:</span><input type="number" min="0" id="c_${s.slug}" placeholder="${s.current_reviews}">
        <button class="b dark" data-count="${s.slug}">Save</button>
        <button class="b" data-insight="${s.slug}">✨ AI insights</button>
        <div class="links"><a href="/r/${s.slug}" target="_blank">Review page ↗</a><a href="/staff/${s.slug}" target="_blank">Staff ↗</a><a href="/poster/${s.slug}" target="_blank">QR poster ↗</a><a href="/live/${s.slug}" target="_blank">Counter display ↗</a></div>
      </div>
    </div>`;
  }).join("");
}

document.addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.count) {
    const v = $("c_" + b.dataset.count).value; if (v === "") return;
    await post("/api/google-count", { slug:b.dataset.count, value:+v }); toast("Saved"); load();
  } else if (b.dataset.insight) {
    const s = b.dataset.insight; b.disabled = true; b.textContent = "Thinking…";
    const r = await post("/api/insights", { slug:s }); insightCache[s] = await r.json();
    $("ins_" + s).innerHTML = insightHtml(s); b.disabled = false; b.textContent = "✨ AI insights";
  }
});
$("copyReport").onclick = async () => {
  const text = await (await fetch("/api/report?key=" + encodeURIComponent(key))).text();
  try { await navigator.clipboard.writeText(text); toast("Report copied, paste it in your write-up"); } catch (e) { alert(text); }
};
$("fetchCounts").onclick = async () => { const r = await post("/api/google-count/refresh", {}); toast(r.ok ? "Fetched from Google" : "Could not fetch"); load(); };
$("addBtn").onclick = () => $("modal").classList.remove("hidden");
$("f_cancel").onclick = () => $("modal").classList.add("hidden");
$("f_save").onclick = async () => {
  $("f_err").textContent = "";
  const r = await post("/api/shops", { name:$("f_name").value, type:$("f_type").value, emoji:$("f_emoji").value, review_url:$("f_url").value,
    menu:$("f_menu").value, baseline_reviews:$("f_base").value, staff_pin:$("f_pin").value, color:$("f_color").value });
  if (!r.ok) { $("f_err").textContent = (await r.json()).detail || "Could not save"; return; }
  $("modal").classList.add("hidden"); toast("Business added"); load();
};
$("go").onclick = () => { key = $("key").value; load(); };
$("key").onkeydown = e => { if (e.key === "Enter") $("go").click(); };
load();
setInterval(() => { if (!$("main").classList.contains("hidden") && $("modal").classList.contains("hidden")) load(); }, 30000);
</script>
</body>
</html>
